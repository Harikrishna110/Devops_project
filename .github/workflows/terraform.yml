name: Plan and Apply Terraform

on:
  push:

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.8.0

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format check
        run: terraform fmt

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: |
          set -o pipefail
          terraform plan -no-color -detailed-exitcode | tee tfplan.txt
          echo "exitcode=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Capture Plan Exit Code
        id: check_plan
        run: |
          echo "exitcode=${{ steps.plan.outcome == 'success' && '0' || (steps.plan.outcome == 'failure' && '1' || '2') }}" >> $GITHUB_OUTPUT
      - name: Comment Terraform Plan on PR
  uses: actions/github-script@v7
  if: (steps.plan.outcome == 'success' || steps.plan.outcome == 'failure') && !(github.event_name == 'push' && github.ref == 'refs/heads/main')
  with:
    script: |
      const fs = require('fs');

      const branch = context.ref.replace('refs/heads/', '');
      const prs = await github.rest.pulls.list({
        owner: context.repo.owner,
        repo: context.repo.repo,
        head: `${context.repo.owner}:${branch}`,
        state: 'open'
      });

      if (!prs.data.length) {
        console.log('No open PR found for this branch; skipping comment.');
        return;
      }

      const pr = prs.data[0];
      const planOutput = fs.existsSync('tfplan.txt')
        ? fs.readFileSync('tfplan.txt', 'utf8')
        : 'Terraform plan output file was not created. Check the Terraform Plan step logs.';

      const summaryMatch = planOutput.match(
        /Plan: (\d+) to add, (\d+) to change, (\d+) to destroy\./
      );

      let summary;
      if (summaryMatch) {
        summary = `\`\`\`
      Create: ${summaryMatch[1]}
      Update: ${summaryMatch[2]}
      Delete: ${summaryMatch[3]}
      \`\`\``;
      } else if (/No changes\. Your infrastructure matches the configuration\./.test(planOutput)) {
        summary = '```\nCreate: 0\nUpdate: 0\nDelete: 0\n```';
      } else {
        summary = '⚠️ Could not parse the plan summary.';
      }

      const body = [
        '## Terraform Plan Summary',
        summary,
        `<details>
      <summary>Show Plan Details</summary>

      \`\`\`hcl
       ${planOutput.slice(0, 60000)}
      \`\`\`
      </details>`,
        `Pusher: @${context.actor}, Branch: \`${branch}\`, Workflow: \`${context.workflow}\``
      ].join('\n\n');

      await github.rest.issues.createComment({
        issue_number: pr.number,
        owner: context.repo.owner,
        repo: context.repo.repo,
        body
      });

      - name: Fail if Terraform Plan failed (syntax or auth issue)
        if: steps.plan.outputs.exitcode == '1'
        run: |
          echo "❌ Terraform plan failed with exit code 1"
          exit 1

      - name: Terraform Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve
